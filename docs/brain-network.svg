<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="900" fill="#0f172a"/>

  <!-- title -->
  <text x="640" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#f1f5f9">Particle Brain — Recurrent Neural Network &amp; Per-Frame Pipeline</text>

  <!-- ============ per-frame pass order strip ============ -->
  <rect x="40" y="56" width="1200" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="83" font-size="13" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">brainStep</text>
  <text x="228" y="79" text-anchor="middle" font-size="14" fill="#64748b">→</text>
  <text x="300" y="83" font-size="13" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">brainLearn (lr&gt;0)</text>
  <text x="470" y="79" text-anchor="middle" font-size="14" fill="#64748b">→</text>
  <text x="520" y="83" font-size="13" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">spatial binning</text>
  <text x="690" y="79" text-anchor="middle" font-size="14" fill="#64748b">→</text>
  <text x="730" y="83" font-size="13" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">force pass</text>
  <text x="862" y="79" text-anchor="middle" font-size="14" fill="#64748b">→</text>
  <text x="905" y="83" font-size="13" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">advance</text>
  <text x="1012" y="79" text-anchor="middle" font-size="14" fill="#64748b">→</text>
  <text x="1055" y="83" font-size="13" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">brainMutate</text>
  <text x="1162" y="79" text-anchor="middle" font-size="14" fill="#64748b">→</text>
  <text x="1195" y="83" font-size="13" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">render</text>

  <!-- ============ row 1: main forward path ============ -->

  <!-- A: urges -->
  <rect x="40" y="140" width="220" height="190" rx="10" fill="#7c2d12" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="150" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#fde68a">Urges (U particles)</text>
  <text x="56" y="192" font-size="12.5" fill="#fcd34d">per-particle drive params:</text>
  <text x="56" y="214" font-size="12.5" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">driveTarget   setpoint</text>
  <text x="56" y="233" font-size="12.5" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">driveScale    sensitivity</text>
  <text x="56" y="252" font-size="12.5" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">driveGain     weight in net</text>
  <line x1="56" y1="264" x2="244" y2="264" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="56" y="284" font-size="12.5" fill="#fcd34d">signal = smoothed metric M</text>
  <text x="56" y="303" font-size="12.5" fill="#fcd34d">(normalized density of its</text>
  <text x="56" y="320" font-size="12.5" fill="#fcd34d">target color, mean = 1.0)</text>

  <!-- B: errors -->
  <rect x="320" y="140" width="220" height="190" rx="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="430" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#fecaca">Urge errors</text>
  <text x="430" y="184" text-anchor="middle" font-size="11.5" fill="#fca5a5">brainStep · phase 1</text>
  <line x1="336" y1="196" x2="524" y2="196" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="430" y="222" text-anchor="middle" font-size="13" fill="#fee2e2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">error[u] = clamp((target −</text>
  <text x="430" y="241" text-anchor="middle" font-size="13" fill="#fee2e2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">signal) / scale, −1, 1)</text>
  <text x="430" y="260" text-anchor="middle" font-size="13" fill="#fee2e2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">× gain</text>
  <text x="430" y="288" text-anchor="middle" font-size="12" fill="#fca5a5">positive = “too little” of target</text>
  <text x="430" y="306" text-anchor="middle" font-size="12" fill="#fca5a5">copied to storedErrors[64]</text>

  <!-- C: hidden layer -->
  <rect x="600" y="140" width="240" height="190" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="720" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#bfdbfe">Hidden layer (H = 8)</text>
  <text x="720" y="184" text-anchor="middle" font-size="11.5" fill="#93c5fd">recurrent · tanh units</text>
  <line x1="616" y1="196" x2="824" y2="196" stroke="#60a5fa" stroke-opacity="0.4"/>
  <text x="720" y="222" text-anchor="middle" font-size="13" fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">h_new[i] = tanh(</text>
  <text x="720" y="241" text-anchor="middle" font-size="13" fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Σ_u W_down[i,u]·error[u]</text>
  <text x="720" y="260" text-anchor="middle" font-size="13" fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+ Σ_j W_recur[i,j]·h[j]</text>
  <text x="720" y="279" text-anchor="middle" font-size="13" fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+ b[i])</text>
  <!-- recurrent self-loop above the box -->
  <path d="M 680 140 V 122 H 760 V 140" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
  <text x="720" y="116" text-anchor="middle" font-size="11.5" fill="#93c5fd">recurrent: h_new → brainState[8] → next frame's h_prev</text>

  <!-- D: output groups -->
  <rect x="900" y="140" width="340" height="190" rx="10" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1070" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#ddd6fe">Output groups (G = 16) → neuronMods[N]</text>
  <text x="1070" y="184" text-anchor="middle" font-size="11.5" fill="#c4b5fd">brainStep · phase 5</text>
  <line x1="916" y1="196" x2="1224" y2="196" stroke="#a78bfa" stroke-opacity="0.4"/>
  <text x="1070" y="222" text-anchor="middle" font-size="13" fill="#ede9fe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mod[n] = clamp( tanh(groupW[grp(n)]·</text>
  <text x="1070" y="241" text-anchor="middle" font-size="13" fill="#ede9fe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">h_new) + bias[n], −1, 1 )</text>
  <text x="1070" y="268" text-anchor="middle" font-size="12" fill="#c4b5fd">grp(n) = n % 16 — neurons in a group share one</text>
  <text x="1070" y="286" text-anchor="middle" font-size="12" fill="#c4b5fd">weight vector, each keeps its own bias</text>
  <text x="1070" y="309" text-anchor="middle" font-size="12" fill="#c4b5fd">N ≤ 128 modulations written to neuronMods buffer</text>

  <!-- ============ row 2: feedback / effectors ============ -->

  <!-- G: mutate -->
  <rect x="320" y="400" width="220" height="190" rx="10" fill="#374151" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="430" y="426" text-anchor="middle" font-size="15" font-weight="bold" fill="#e5e7eb">brainMutate</text>
  <text x="430" y="444" text-anchor="middle" font-size="11.5" fill="#d1d5db">after advance · slow genome drift</text>
  <line x1="336" y1="456" x2="524" y2="456" stroke="#9ca3af" stroke-opacity="0.4"/>
  <text x="430" y="480" text-anchor="middle" font-size="12.5" fill="#f3f4f6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">driveTarget += g·0.005·c</text>
  <text x="430" y="499" text-anchor="middle" font-size="12.5" fill="#f3f4f6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">driveScale *= 1 + g·0.003·c</text>
  <text x="430" y="518" text-anchor="middle" font-size="12.5" fill="#f3f4f6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">driveGain += g·0.003·c</text>
  <text x="430" y="545" text-anchor="middle" font-size="12" fill="#d1d5db">c = changeability ∈ [0.02, 1]</text>
  <text x="430" y="563" text-anchor="middle" font-size="12" fill="#d1d5db">per-urge (hash of local index)</text>
  <text x="430" y="581" text-anchor="middle" font-size="12" fill="#d1d5db">g = frame-seeded pseudo-Gaussian</text>

  <!-- F: learn -->
  <rect x="600" y="400" width="240" height="190" rx="10" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="720" y="426" text-anchor="middle" font-size="15" font-weight="bold" fill="#99f6e4">brainLearn</text>
  <text x="720" y="444" text-anchor="middle" font-size="11.5" fill="#5eead4">only dispatched when lr &gt; 0</text>
  <line x1="616" y1="456" x2="824" y2="456" stroke="#2dd4bf" stroke-opacity="0.4"/>
  <text x="720" y="482" text-anchor="middle" font-size="13" fill="#ccfbf1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">W_down[i,u] += lr ·</text>
  <text x="720" y="501" text-anchor="middle" font-size="13" fill="#ccfbf1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">h_new[i] · error[u]</text>
  <text x="720" y="528" text-anchor="middle" font-size="12" fill="#5eead4">Hebbian: paths from active errors to</text>
  <text x="720" y="546" text-anchor="middle" font-size="12" fill="#5eead4">active hidden units strengthen</text>
  <text x="720" y="570" text-anchor="middle" font-size="12" fill="#99f6e4">updated weights clamped to ±2</text>

  <!-- E: force pass -->
  <rect x="900" y="400" width="340" height="190" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="1070" y="426" text-anchor="middle" font-size="15" font-weight="bold" fill="#a7f3d0">Force pass — neurons as effectors</text>
  <line x1="916" y1="440" x2="1224" y2="440" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="1070" y="466" text-anchor="middle" font-size="13" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">drive_m += neuronMods[m] × brainGain</text>
  <text x="1070" y="485" text-anchor="middle" font-size="12" fill="#6ee7b7">(default 1.5; 0 = brain disabled)</text>
  <text x="1070" y="512" text-anchor="middle" font-size="13" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">F = drive × urgeForce × falloff</text>
  <text x="1070" y="531" text-anchor="middle" font-size="12" fill="#6ee7b7">applied only to the neuron's target-color matter</text>
  <line x1="916" y1="544" x2="1224" y2="544" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="1070" y="564" text-anchor="middle" font-size="12" fill="#a7f3d0">coexists with local wiring: drive also sums</text>
  <text x="1070" y="581" text-anchor="middle" font-size="12" fill="#a7f3d0">nearby urges' control · firing = |drive| → local Lorentz field</text>

  <!-- ============ arrows: forward path ============ -->
  <line x1="260" y1="235" x2="314" y2="235" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="287" y="224" text-anchor="middle" font-size="11" fill="#cbd5e1">target/scale/gain + signal</text>

  <line x1="540" y1="235" x2="594" y2="235" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="567" y="224" text-anchor="middle" font-size="11" fill="#cbd5e1">error[64]</text>

  <line x1="840" y1="235" x2="894" y2="235" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="867" y="224" text-anchor="middle" font-size="11" fill="#cbd5e1">h_new[8]</text>

  <line x1="1070" y1="330" x2="1070" y2="394" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1082" y="366" font-size="11" fill="#cbd5e1">neuronMods[N] ∈ [−1, 1]</text>

  <!-- ============ arrows: brainLearn inputs / output ============ -->
  <path d="M 430 330 V 368 H 640 V 394" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="520" y="361" text-anchor="middle" font-size="11" fill="#fca5a5">storedErrors[64]</text>

  <line x1="700" y1="330" x2="700" y2="394" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
  <text x="688" y="366" text-anchor="end" font-size="11" fill="#93c5fd">h_new[8]</text>

  <line x1="760" y1="400" x2="760" y2="336" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#arrowTeal)"/>
  <text x="772" y="352" font-size="11" fill="#5eead4">W_down update (in place)</text>

  <!-- ============ arrows: mutate loop with urges ============ -->
  <path d="M 150 330 V 368 H 400 V 394" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="272" y="361" text-anchor="middle" font-size="11" fill="#d1d5db">drive params read each frame</text>

  <path d="M 320 480 H 288 V 300 H 266" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="278" y="470" text-anchor="end" font-size="11" fill="#d1d5db">updated setpoints</text>

  <!-- ============ legend / reference row ============ -->
  <rect x="40" y="640" width="380" height="240" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="666" font-size="14" font-weight="bold" fill="#f1f5f9">Weights buffer — 840 × f32 (one global network)</text>
  <text x="60" y="692" font-size="12.5" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">W_down   [512]  H×U, U padded to 64</text>
  <text x="60" y="711" font-size="12.5" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">b_down   [8]    hidden biases</text>
  <text x="60" y="730" font-size="12.5" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">W_recur  [64]   H×H recurrent loop</text>
  <text x="60" y="749" font-size="12.5" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">groupW   [128]  G×H output groups</text>
  <text x="60" y="768" font-size="12.5" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">biases   [128]  per-neuron, N padded</text>
  <line x1="60" y1="782" x2="400" y2="782" stroke="#334155"/>
  <text x="60" y="802" font-size="12" fill="#94a3b8">init: W_down ±0.3 · W_recur ±0.05 ·</text>
  <text x="60" y="820" font-size="12" fill="#94a3b8">groupW ±0.3 · biases ±0.15 (random)</text>
  <text x="60" y="844" font-size="12" fill="#fbbf24">frozen — only W_down changes, and only</text>
  <text x="60" y="862" font-size="12" fill="#fbbf24">while brainLearn runs (lr &gt; 0)</text>

  <rect x="450" y="640" width="370" height="240" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="470" y="666" font-size="14" font-weight="bold" fill="#f1f5f9">Persistent GPU buffers</text>
  <text x="470" y="692" font-size="12.5" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">brainState[8]    hidden state h (survives frames)</text>
  <text x="470" y="711" font-size="12.5" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">storedErrors[64] this frame's urge errors</text>
  <text x="470" y="730" font-size="12.5" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">neuronMods[128]  per-neuron output ∈ [−1, 1]</text>
  <line x1="470" y1="746" x2="800" y2="746" stroke="#334155"/>
  <text x="470" y="770" font-size="12" fill="#94a3b8">Two-tier genome:</text>
  <text x="470" y="792" font-size="12" fill="#fbbf24">slow tier — per-urge drive params (mutated)</text>
  <text x="470" y="811" font-size="12" fill="#5eead4">fast tier — W_down input weights (Hebbian, lr&gt;0)</text>
  <text x="470" y="836" font-size="12" fill="#94a3b8">brainStep runs first each frame so the force</text>
  <text x="470" y="854" font-size="12" fill="#94a3b8">pass reads this frame's modulations; single</text>
  <text x="470" y="872" font-size="12" fill="#94a3b8">workgroup of 64 threads per brain pass</text>

  <rect x="850" y="640" width="390" height="240" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="870" y="666" font-size="14" font-weight="bold" fill="#f1f5f9">Constants &amp; key files</text>
  <text x="870" y="692" font-size="12.5" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">U ≤ 64 urges · H = 8 hidden · G = 16 groups</text>
  <text x="870" y="711" font-size="12.5" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">N ≤ 128 motor neurons</text>
  <line x1="870" y1="726" x2="1220" y2="726" stroke="#334155"/>
  <text x="870" y="750" font-size="12.5" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">brainStep.wgsl     forward pass (errors → mods)</text>
  <text x="870" y="769" font-size="12.5" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">brainLearn.wgsl    Hebbian W_down update</text>
  <text x="870" y="788" font-size="12.5" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">brainMutate.wgsl   drive-param drift</text>
  <text x="870" y="807" font-size="12.5" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">particleComputeForces.wgsl  reads neuronMods</text>
  <line x1="870" y1="822" x2="1220" y2="822" stroke="#334155"/>
  <text x="870" y="840" font-size="12" fill="#94a3b8">Sense neurons (sight/smell/sound) are sensors</text>
  <text x="870" y="858" font-size="12" fill="#94a3b8">only — they read the world but never enter this</text>
  <text x="870" y="876" font-size="12" fill="#94a3b8">network's inputs or outputs.</text>
</svg>